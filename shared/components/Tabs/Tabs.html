<!--
  Componente custom: Tabs
  Tabs custom; cifra.js alterna aria-selected y los [data-tabpanel].
  Estilos: shared/components/Tabs/Tabs.css (cargar después de shared/globals.css).
  Ejemplo tomado de index.html. Rutas de assets relativas a la raíz del repo.
-->
<div class="c-tabs" role="tablist" data-custom="Tabs">
  <button class="c-tabs__tab" role="tab" aria-selected="true">Active</button>
  <button class="c-tabs__tab" role="tab" aria-selected="false">Dismissed</button>
</div>

<!--
  Componente custom: Card
  Card custom con pie de fuentes. Usar <s-section> cuando alcance.
  Estilos: shared/components/Card/Card.css (cargar después de shared/globals.css).
  Ejemplo tomado de modules/dashboards/index.html. Rutas de assets relativas a la raíz del repo.
-->
<article class="c-card" data-custom="KpiCard">
  <div class="c-card__body">
    <h3 class="c-card__title">Gross Sales</h3>
    <div class="c-kpi__row">
      <span><span class="c-kpi__value">$9,505.93</span> <span class="c-delta c-delta--up">↗ 180.56%</span></span>
      <span data-spark="rand:1" data-prev="rand:2:30:60:30"></span>
    </div>
  </div>
  <footer class="c-card__footer c-card__footer--source"><span class="c-card__sources">From 1 source</span><span class="c-source" data-source="shopify" role="img" aria-label="Shopify" title="Shopify"></span></footer>
</article>
